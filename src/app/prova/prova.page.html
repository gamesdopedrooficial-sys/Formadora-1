<ion-header>
  <ion-toolbar color="secondary">
    <ion-title>Sobre</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding ion-text-center">
  <h2>Sobre mim</h2>
  <p>{{ descricao }}</p>

  <ion-button (click)="getJoke()" expand="block" color="tertiary">
    Mostrar Piada

  <p>{{ jokeSetup }}</p>

  <ion-button routerLink="/" expand="block" color="primary">
    Voltar
  </ion-button>
</ion-content>
